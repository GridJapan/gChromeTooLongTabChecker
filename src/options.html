<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TooLong Tab Checker</title>
<style>
  body { font: 13px/1.5 -apple-system, "Hiragino Sans", sans-serif; margin: 0; min-width: 480px; max-width: 640px; color: #222; }
  header { padding: 10px 12px 6px; border-bottom: 1px solid #e5e5e5; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  #summary { color: #555; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow-y: auto; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
  li:hover, li:focus { background: #fdecea; outline: none; }
  li img { width: 16px; height: 16px; flex: none; }
  .age { flex: none; width: 5.5em; color: #c62828; font-weight: 600; text-align: right; }
  .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win { flex: none; color: #888; font-size: 12px; }
  .empty { padding: 16px 12px; color: #2e7d32; }
  footer { padding: 8px 12px; border-top: 1px solid #e5e5e5; color: #555; font-size: 12px; }
  footer input { width: 4.5em; }
  footer button { margin-left: 4px; }
  #perm { display: block; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>TooLong Tab Checker</h1>
  <div id="summary">読み込んでいます…</div>
</header>
<ul id="list"></ul>
<footer>
  読み込んでから <input id="hours" type="number" min="0.1" step="0.5"> 時間を過ぎたタブを出す
  <button id="save">変える</button>
  <div id="perm-note"></div>
  <button id="perm">すでに開いているタブの読み込み時刻を正確に読む（許可を求めます）</button>
</footer>
<script type="module" src="options.js"></script>
</body>
</html>
